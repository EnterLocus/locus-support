name: Wishlist
description: Share a Place, workflow, or bigger idea you would love to see someday.
title: "[Wishlist]: "
labels: [wishlist]
body:
  - type: markdown
    attributes:
      value: |
        Wishlist posts are public and do not promise a delivery date. Do not share room images, credentials, receipts, order information, account data, notifications, or other personal information. Email [support@enterlocus.com](mailto:support@enterlocus.com?subject=Locus%20private%20wishlist) when the idea needs private context.
  - type: textarea
    id: wish
    attributes:
      label: What would you love Locus to make possible?
      placeholder: I would love to…
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would this matter to you?
      description: Tell us about the work session or experience this would improve.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private room details, credentials, receipts, order information, account data, notifications, and other personal information.
          required: true
