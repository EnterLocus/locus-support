name: Feature request
description: Suggest a concrete improvement to an existing Locus workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are public. Describe the need without sharing room images, credentials, receipts, order details, account data, or other personal information. Email [support@enterlocus.com](mailto:support@enterlocus.com?subject=Locus%20private%20feature%20request) if the context must remain private.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Start with the outcome you want, not a proposed implementation.
      placeholder: When I am…, I want to…, so that…
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What happens today?
      description: Explain the current limitation and any workaround you use.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would make this better?
      description: A sketch of the experience is welcome, but do not include private screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private room details, credentials, receipts, order information, account data, notifications, and other personal information.
          required: true
